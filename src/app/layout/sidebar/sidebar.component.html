<!-- Overlay oscuro para móviles cuando el sidebar está abierto -->
<div *ngIf="isSidebarOpenMobile()" (click)="layoutService.setSidebarMobileState(false)"
  class="fixed inset-0 z-40 bg-black/50 lg:hidden transition-opacity">
</div>

<!-- Sidebar Container Limpio (Blanco en Light Mode, Azul Marino en Dark Mode) -->
<aside
  [ngClass]="{
    'w-[290px]': !isSidebarCollapsed(),
    'w-[88px]': isSidebarCollapsed(),
    'translate-x-0': isSidebarOpenMobile(),
    '-translate-x-full': !isSidebarOpenMobile()
  }"
  class="fixed lg:static inset-y-0 left-0 z-50 flex flex-col bg-white dark:bg-[#1E293B] text-slate-600 dark:text-slate-300 transition-all duration-300 ease-in-out lg:translate-x-0 h-full overflow-hidden shadow-sm border-r border-slate-100 dark:border-slate-800 font-heading">
  
  <!-- Logo Section -->
  <div class="flex items-center justify-between px-6 py-5 lg:py-6" [ngClass]="{'justify-center': isSidebarCollapsed()}">
    <a routerLink="/" class="text-2xl font-bold text-slate-800 dark:text-white flex items-center gap-3">
      <div class="min-w-8 min-h-8 w-8 h-8 bg-corporate-primary rounded-lg flex items-center justify-center shadow-sm">
        <span class="text-white text-sm font-black">A</span>
      </div>
      <span class="transition-opacity duration-300 whitespace-nowrap" [ngClass]="{'opacity-0 hidden': isSidebarCollapsed(), 'opacity-100 block': !isSidebarCollapsed()}">
        Antigravity
      </span>
    </a>
    
    <!-- Close Button (Mobile Only) -->
    <button (click)="layoutService.setSidebarMobileState(false)" class="lg:hidden text-slate-400 hover:text-corporate-primary transition-colors">
      <i class="fa-solid fa-xmark text-xl"></i>
    </button>
  </div>

  <!-- Navigation Menu -->
  <nav class="flex-1 overflow-y-auto overflow-x-hidden px-4 py-4 scrollbar-hide text-[14px]">
    
    <!-- Plantilla Recursiva para Submenús -->
    <ng-template #menuTemplate let-items="items" let-level="level">
      <ul class="space-y-1.5" [ngClass]="{'mt-1.5': level > 0}">
        <li *ngFor="let item of items">
          
          <!-- Elemento Simple o Padre -->
          <a *ngIf="item.path; else parentMenu"
             [routerLink]="item.path" 
             routerLinkActive #rla="routerLinkActive"
             [routerLinkActiveOptions]="{exact: item.path === '/'}"
             (click)="closeSidebarMobile()"
             class="group relative flex items-center gap-3 rounded-lg py-2.5 transition-all duration-200"
             [ngClass]="{
               'bg-corporate-primary text-white shadow-sm font-medium': rla.isActive,
               'text-slate-600 hover:bg-slate-100 hover:text-corporate-primary dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white': !rla.isActive,
               'px-3': level === 0,
               'pl-6 pr-3': level === 1 && !isSidebarCollapsed(),
               'pl-10 pr-3 font-sans text-[13px]': level === 2 && !isSidebarCollapsed(),
               'justify-center px-0': isSidebarCollapsed()
             }">
            
            <!-- Icono Font Awesome -->
            <div *ngIf="item.icon" class="min-w-6 flex-shrink-0 flex justify-center">
              <i class="text-lg w-6 text-center transition-colors" [ngClass]="item.icon"></i>
            </div>
            
            <!-- Indicador Sutil Nivel 3 -->
            <div *ngIf="!item.icon && level === 2 && !isSidebarCollapsed()" 
                 class="absolute left-6 select-none" [ngClass]="rla.isActive ? 'text-white/70' : 'text-slate-300 dark:text-slate-600'">-</div>

            <!-- Título -->
            <span class="transition-opacity duration-300 whitespace-nowrap" 
                  [ngClass]="{'opacity-0 hidden': isSidebarCollapsed() && level === 0, 'opacity-100 block': !isSidebarCollapsed()}">
              {{ item.title }}
            </span>

            <!-- Tooltip en Modo Colapsado -->
            <div *ngIf="isSidebarCollapsed() && level === 0" class="absolute left-full ml-4 hidden px-3 py-1.5 bg-slate-800 text-white text-[12px] rounded-md whitespace-nowrap group-hover:block z-50 shadow-lg font-sans">
              {{ item.title }}
            </div>
          </a>

          <!-- Plantilla del Padre (Desplegable) -->
          <ng-template #parentMenu>
            <button (click)="toggleSubMenu(item.title)"
                    class="group relative flex w-full items-center justify-between gap-3 rounded-lg py-2.5 transition-all duration-200 text-slate-600 hover:bg-slate-100 hover:text-corporate-primary dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white"
                    [ngClass]="{
                      'px-3': level === 0,
                      'pl-6 pr-3': level === 1 && !isSidebarCollapsed(),
                      'pl-10 pr-3 font-sans text-[13px]': level === 2 && !isSidebarCollapsed(),
                      'justify-center px-0': isSidebarCollapsed(),
                      'bg-slate-50 dark:bg-slate-800/50': isSubMenuOpen(item.title)
                    }">
              
              <div class="flex items-center gap-3">
                <div *ngIf="item.icon" class="min-w-6 flex-shrink-0 flex justify-center">
                  <i class="text-lg w-6 text-center transition-colors" [ngClass]="item.icon" [class.text-corporate-primary]="isSubMenuOpen(item.title)"></i>
                </div>
                
                <span class="transition-opacity duration-300 whitespace-nowrap" 
                      [ngClass]="{
                        'opacity-0 hidden': isSidebarCollapsed() && level === 0, 
                        'opacity-100 block': !isSidebarCollapsed(),
                        'font-medium text-corporate-primary dark:text-white': isSubMenuOpen(item.title)
                      }">
                  {{ item.title }}
                </span>
              </div>

              <!-- Flecha Expandir/Contraer -->
              <i *ngIf="!isSidebarCollapsed()" 
                 class="fa-solid fa-chevron-down text-[10px] transition-transform duration-200" 
                 [ngClass]="{'rotate-180 text-corporate-primary dark:text-white': isSubMenuOpen(item.title)}"></i>
            </button>
            
            <!-- Contenedor Animado de los Hijos -->
            <div *ngIf="isSubMenuOpen(item.title) && item.children" class="overflow-hidden">
              <ng-container *ngTemplateOutlet="menuTemplate; context: { items: item.children, level: level + 1 }"></ng-container>
            </div>
          </ng-template>

        </li>
      </ul>
    </ng-template>

    <!-- Iniciar Menú Nivel 0 -->
    <ng-container *ngTemplateOutlet="menuTemplate; context: { items: filteredMenu(), level: 0 }"></ng-container>

  </nav>

  <!-- Footer/User Info (Blanco/Gris) -->
  <div class="h-16 px-4 flex items-center border-t border-slate-100 dark:border-slate-800 bg-white dark:bg-[#1E293B]">
    <div class="flex items-center gap-3 w-full" [ngClass]="{'justify-center': isSidebarCollapsed()}">
      <div class="min-w-10 min-h-10 w-10 h-10 rounded-md bg-white border border-slate-200 dark:bg-slate-800 dark:border-slate-700 flex items-center justify-center text-corporate-primary font-bold shadow-sm">
        {{ currentUser()?.person?.firstName?.charAt(0) || 'U' }}
      </div>
      <div class="transition-opacity duration-300 whitespace-nowrap overflow-hidden" [ngClass]="{'opacity-0 hidden': isSidebarCollapsed(), 'opacity-100 block': !isSidebarCollapsed()}">
        <p class="text-sm font-semibold text-slate-800 dark:text-white truncate">{{ currentUser()?.person?.firstName }} {{ currentUser()?.person?.lastName }}</p>
        <p class="text-[11px] text-slate-500 dark:text-slate-400 truncate uppercase tracking-wider font-sans">{{ currentUser()?.roles?.join(', ') }}</p>
      </div>
    </div>
  </div>
</aside>
