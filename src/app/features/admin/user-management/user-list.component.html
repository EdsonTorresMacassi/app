<!-- Header de página -->
<div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
  <div>
    <h2 class="text-2xl font-bold text-slate-800 dark:text-white font-heading">
      Gestión de Usuarios
    </h2>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
      {{ filteredUsers().length }} usuarios registrados en el sistema
    </p>
  </div>
  <button *ngIf="authService.hasPermission('USER_WRITE')"
          (click)="openCreateModal()"
          class="inline-flex items-center justify-center gap-2 rounded-lg
                 bg-corporate-primary py-2.5 px-5 text-sm font-semibold text-white
                 hover:bg-opacity-90 transition-all shadow-sm hover:shadow-md
                 hover:shadow-corporate-primary/30 active:scale-[0.98]">
    <i class="fa-solid fa-plus text-xs"></i>
    Nuevo Usuario
  </button>
</div>

<!-- Error global -->
<div *ngIf="error()"
     class="mb-4 flex items-center gap-3 rounded-xl border border-rose-200
            bg-rose-50 dark:bg-rose-900/20 dark:border-rose-800/40 p-4">
  <i class="fa-solid fa-triangle-exclamation text-rose-500 flex-shrink-0"></i>
  <span class="text-sm text-rose-700 dark:text-rose-400">{{ error() }}</span>
  <button (click)="loadUsers()"
          class="ml-auto text-xs text-rose-600 hover:underline font-medium">
    Reintentar
  </button>
</div>

<!-- Tabla card -->
<div class="rounded-xl border border-slate-200 bg-white shadow-sm
            dark:border-slate-700 dark:bg-slate-800 overflow-hidden">

  <!-- Barra de herramientas -->
  <div class="border-b border-slate-200 dark:border-slate-700 p-4 flex flex-col
              sm:flex-row gap-3 justify-between items-center">
    <div class="relative w-full sm:max-w-xs">
      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
        <i class="fa-solid fa-magnifying-glass text-sm"></i>
      </span>
      <input type="text"
             placeholder="Buscar por nombre, email o usuario..."
             [ngModel]="searchQuery()"
             (ngModelChange)="searchQuery.set($event)"
             class="w-full rounded-lg border border-slate-200 bg-slate-50
                    dark:bg-slate-700 dark:border-slate-600 dark:text-white
                    py-2.5 pl-9 pr-4 text-sm outline-none
                    focus:border-corporate-primary focus:ring-2
                    focus:ring-corporate-primary/20 transition-all
                    placeholder-slate-400" />
    </div>
    <button (click)="loadUsers()"
            class="flex items-center gap-2 text-sm text-slate-500
                   hover:text-slate-700 dark:text-slate-400 dark:hover:text-white
                   border border-slate-200 dark:border-slate-700 px-3.5 py-2.5
                   rounded-lg transition-colors hover:bg-slate-50 dark:hover:bg-slate-700">
      <i class="fa-solid fa-arrows-rotate text-xs"></i>
      Actualizar
    </button>
  </div>

  <!-- Grid -->
  <div *ngIf="!isLoading()">
    <app-grid
      [data]="filteredUsers()"
      [columns]="columns"
      ariaLabel="Listado de usuarios"
      [pageSize]="10"
      [pageSizeOptions]="[10, 20, 50]"
      [stickyHeader]="true"
      [showPagination]="true"
      [resizableColumns]="true"
      emptyTitle="No se encontraron usuarios"
      emptyDescription="No existen usuarios registrados o la búsqueda no arrojó resultados."
    ></app-grid>
  </div>
</div>

<!-- Modal crear usuario -->
<div *ngIf="showCreateModal()"
     class="fixed inset-0 z-50 flex items-center justify-center bg-black/50
            backdrop-blur-sm p-4">
  <app-create-user-form
    (onSuccess)="onUserCreated()"
    (onCancel)="closeCreateModal()">
  </app-create-user-form>
</div>

<!-- Modal editar usuario -->
<div *ngIf="showEditModal() && selectedUserForEdit()"
     class="fixed inset-0 z-50 flex items-center justify-center bg-black/50
            backdrop-blur-sm p-4">
  <app-edit-user-form
    [personId]="selectedUserForEdit()!"
    (onSuccess)="onUserEdited()"
    (onCancel)="closeEditModal()">
  </app-edit-user-form>
</div>

<!-- Modal confirmar deshabilitar -->
<div *ngIf="showDisableModal()"
     class="fixed inset-0 z-50 flex items-center justify-center bg-black/50
            backdrop-blur-sm p-4">
  <div class="w-full max-w-md rounded-2xl bg-white dark:bg-slate-800 shadow-2xl p-6">
    <div class="mb-4 flex h-14 w-14 items-center justify-center rounded-2xl
                bg-rose-50 dark:bg-rose-900/20 mx-auto">
      <i class="fa-solid fa-triangle-exclamation text-2xl text-rose-500"></i>
    </div>
    <h3 class="text-lg font-bold text-slate-800 dark:text-white text-center mb-2">
      Deshabilitar usuario
    </h3>
    <p class="text-sm text-slate-500 dark:text-slate-400 text-center mb-6">
      ¿Estás seguro de deshabilitar a
      <span class="font-semibold text-slate-700 dark:text-slate-200">
        {{ selectedUser()?.firstName }} {{ selectedUser()?.lastName }}
      </span>?
      El usuario perderá acceso al sistema inmediatamente.
    </p>
    <div class="flex gap-3">
      <button (click)="closeDisableModal()"
              class="flex-1 rounded-lg border border-slate-200 dark:border-slate-700
                     px-4 py-2.5 text-sm font-semibold text-slate-600 dark:text-slate-300
                     hover:bg-slate-50 dark:hover:bg-slate-700 transition-all">
        Cancelar
      </button>
      <button (click)="confirmDisable()"
              class="flex-1 rounded-lg bg-rose-500 px-4 py-2.5 text-sm font-semibold
                     text-white hover:bg-rose-600 transition-all shadow-sm">
        Sí, deshabilitar
      </button>
    </div>
  </div>
</div>
