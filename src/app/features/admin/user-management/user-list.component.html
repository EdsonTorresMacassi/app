<!-- Header de página -->
<div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
  <div>
    <h2 class="text-2xl font-bold text-slate-800 dark:text-white font-heading">
      Gestión de Usuarios
    </h2>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
      {{ totalElements() }} usuarios registrados en el sistema
    </p>
  </div>
  <button *ngIf="authService.hasPermission('USER_WRITE')"
          (click)="openCreateModal()"
          class="inline-flex items-center justify-center gap-2 rounded-lg
                 bg-corporate-primary py-2.5 px-5 text-sm font-semibold text-white
                 hover:bg-opacity-90 transition-all shadow-sm hover:shadow-md
                 hover:shadow-corporate-primary/30 active:scale-[0.98]">
    <i class="fa-solid fa-plus text-xs"></i>
    Nuevo Usuario
  </button>
</div>

<!-- Error global -->
<div *ngIf="error()"
     class="mb-4 flex items-center gap-3 rounded-xl border border-rose-200
            bg-rose-50 dark:bg-rose-900/20 dark:border-rose-800/40 p-4">
  <i class="fa-solid fa-triangle-exclamation text-rose-500 flex-shrink-0"></i>
  <span class="text-sm text-rose-700 dark:text-rose-400">{{ error() }}</span>
  <button (click)="loadUsers()"
          class="ml-auto text-xs text-rose-600 hover:underline font-medium">
    Reintentar
  </button>
</div>

<!-- Tabla card -->
<div class="rounded-xl border border-slate-200 bg-white shadow-sm
            dark:border-slate-700 dark:bg-slate-800 overflow-hidden">

  <!-- Barra de Filtros Personalizados -->
  <div class="border-b border-slate-200 dark:border-slate-700 p-4 bg-slate-50/50 dark:bg-slate-800/50">
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
      <!-- Filtro Búsqueda -->
      <div class="relative w-full">
        <label class="block text-xs font-semibold text-slate-500 mb-1">Búsqueda</label>
        <span class="absolute left-3 top-[34px] -translate-y-1/2 text-slate-400">
          <i class="fa-solid fa-magnifying-glass text-sm"></i>
        </span>
        <input type="text"
               placeholder="Nombre, email o usuario"
               [ngModel]="filters().keyword"
               (ngModelChange)="filters.update(f => ({...f, keyword: $event}))"
               class="w-full rounded-lg border border-slate-200 bg-white dark:bg-slate-700 dark:border-slate-600 dark:text-white py-2 pl-9 pr-3 text-sm outline-none focus:border-corporate-primary focus:ring-1 focus:ring-corporate-primary transition-all placeholder-slate-400" />
      </div>

      <!-- Filtro Documento -->
      <div class="w-full">
        <label class="block text-xs font-semibold text-slate-500 mb-1">Nro Documento</label>
        <input type="text"
               placeholder="Buscar documento"
               [ngModel]="filters().docNumber"
               (ngModelChange)="filters.update(f => ({...f, docNumber: $event}))"
               class="w-full rounded-lg border border-slate-200 bg-white dark:bg-slate-700 dark:border-slate-600 dark:text-white py-2 px-3 text-sm outline-none focus:border-corporate-primary focus:ring-1 focus:ring-corporate-primary transition-all placeholder-slate-400" />
      </div>

      <!-- Filtro Estado -->
      <div class="w-full">
        <label class="block text-xs font-semibold text-slate-500 mb-1">Estado</label>
        <select [ngModel]="filters().status"
                (ngModelChange)="filters.update(f => ({...f, status: $event}))"
                class="w-full rounded-lg border border-slate-200 bg-white dark:bg-slate-700 dark:border-slate-600 dark:text-white py-2 px-3 text-sm outline-none focus:border-corporate-primary focus:ring-1 focus:ring-corporate-primary transition-all cursor-pointer">
          <option value="">Todos los estados</option>
          <option value="ACTIVE">Activo</option>
          <option value="INACTIVE">Inactivo</option>
        </select>
      </div>

      <!-- Filtro Rol -->
      <div class="w-full">
        <label class="block text-xs font-semibold text-slate-500 mb-1">Rol de Sistema</label>
        <select [ngModel]="filters().roleName"
                (ngModelChange)="filters.update(f => ({...f, roleName: $event}))"
                class="w-full rounded-lg border border-slate-200 bg-white dark:bg-slate-700 dark:border-slate-600 dark:text-white py-2 px-3 text-sm outline-none focus:border-corporate-primary focus:ring-1 focus:ring-corporate-primary transition-all cursor-pointer">
          <option value="">Todos los roles</option>
          <option *ngFor="let role of roles()" [value]="role.name">{{ role.name }}</option>
        </select>
      </div>
    </div>
    
    <div class="mt-4 flex items-center justify-end gap-3 border-t border-slate-200 dark:border-slate-700 pt-4">
      <button (click)="clearFilters()"
              class="flex items-center gap-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 px-4 py-2 text-sm font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-600 shadow-sm transition-all active:scale-[0.98]">
        <i class="fa-solid fa-eraser text-xs"></i>
        Limpiar Filtros
      </button>
      <button (click)="applyFilters()"
              class="flex items-center gap-2 rounded-lg bg-corporate-primary px-4 py-2 text-sm font-semibold text-white hover:bg-opacity-90 shadow-sm transition-all active:scale-[0.98]">
        <i class="fa-solid fa-filter text-xs"></i>
        Aplicar Filtros
      </button>
    </div>
  </div>

  <!-- Grid -->
  <div *ngIf="!isLoading()">
    <app-grid
      [data]="users()"
      [columns]="columns"
      ariaLabel="Listado de usuarios"
      
      [manualPagination]="true"
      [externalPageCount]="totalPages()"
      [externalRowCount]="totalElements()"
      [pageIndex]="pageIndex()"
      (pageIndexChange)="onPageChange($event)"
      [pageSize]="pageSize()"
      (pageSizeChange)="onPageSizeChange($event)"
      [pageSizeOptions]="[10, 20, 50, 100]"
      
      [stickyHeader]="true"
      [showPagination]="true"
      [resizableColumns]="true"
      emptyTitle="No se encontraron usuarios"
      emptyDescription="No existen usuarios registrados o la búsqueda no arrojó resultados."
    ></app-grid>
  </div>
</div>

<!-- Modal crear usuario -->
<div *ngIf="showCreateModal()"
     class="fixed inset-0 z-50 flex items-center justify-center bg-black/50
            backdrop-blur-sm p-4">
  <app-create-user-form
    (onSuccess)="onUserCreated()"
    (onCancel)="closeCreateModal()">
  </app-create-user-form>
</div>

<!-- Modal editar usuario -->
<div *ngIf="showEditModal() && selectedUserForEdit()"
     class="fixed inset-0 z-50 flex items-center justify-center bg-black/50
            backdrop-blur-sm p-4">
  <app-edit-user-form
    [personId]="selectedUserForEdit()!"
    (onSuccess)="onUserEdited()"
    (onCancel)="closeEditModal()">
  </app-edit-user-form>
</div>
