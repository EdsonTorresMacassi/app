<div class="w-full max-w-2xl rounded-2xl bg-white dark:bg-slate-800
            shadow-2xl overflow-hidden max-h-[90vh] flex flex-col">

  <!-- Header del modal -->
  <div class="flex items-center justify-between border-b border-slate-200
              dark:border-slate-700 px-6 py-4 bg-slate-50/50 dark:bg-slate-800/50
              flex-shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-corporate-primary/10 flex items-center
                  justify-center">
        <i class="fa-solid fa-user-pen text-corporate-primary text-sm"></i>
      </div>
      <div>
        <h3 class="font-bold text-slate-800 dark:text-white">Editar Usuario</h3>
        <p class="text-xs text-slate-500 dark:text-slate-400">
          Modificar información en Keycloak y Oracle
        </p>
      </div>
    </div>
    <button (click)="onCancel.emit()"
            class="w-8 h-8 flex items-center justify-center rounded-lg
                   text-slate-400 hover:text-slate-600 hover:bg-slate-100
                   dark:hover:bg-slate-700 transition-all">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <!-- Loading state -->
  <div *ngIf="isLoading()" class="flex-1 flex flex-col items-center justify-center p-12">
    <svg class="h-8 w-8 animate-spin text-corporate-primary mb-4" viewBox="0 0 24 24" fill="none">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
    </svg>
    <p class="text-sm font-medium text-slate-500">Cargando datos del usuario...</p>
  </div>

  <!-- Formulario con scroll -->
  <form *ngIf="!isLoading()" [formGroup]="form" (ngSubmit)="submit()"
        class="overflow-y-auto flex-1 p-6 space-y-6">

    <!-- Error global -->
    <div *ngIf="error()"
         class="flex items-start gap-3 rounded-xl border border-rose-200 bg-rose-50
                dark:bg-rose-900/20 dark:border-rose-800/40 p-3.5">
      <i class="fa-solid fa-triangle-exclamation text-rose-500 flex-shrink-0 mt-0.5"></i>
      <span class="text-sm text-rose-700 dark:text-rose-400">{{ error() }}</span>
    </div>

    <!-- Sección: Datos personales -->
    <div>
      <p class="text-xs font-semibold uppercase tracking-wider text-slate-400
                dark:text-slate-500 mb-3">Datos personales</p>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <app-input label="Nombres" formControlName="firstName" placeholder="Nombres" [required]="true"></app-input>
        </div>
        <div>
          <app-input label="Apellidos" formControlName="lastName" placeholder="Apellidos" [required]="true"></app-input>
        </div>
        <div class="col-span-2">
          <app-input label="Segundo apellido" formControlName="secondLastName" placeholder="Opcional"></app-input>
        </div>
      </div>
    </div>

    <!-- Sección: Documento -->
    <div>
      <p class="text-xs font-semibold uppercase tracking-wider text-slate-400
                dark:text-slate-500 mb-3">Documento de identidad</p>
      <div class="grid grid-cols-2 gap-4">
        <div data-showcase-root>
          <app-select label="Tipo" formControlName="docType" [options]="docTypeOptions()" placeholder="Seleccionar..." [required]="true"></app-select>
        </div>
        <div>
          <app-input label="Número" formControlName="docNumber" placeholder="Ej: V-12345678" [required]="true"></app-input>
        </div>
      </div>
    </div>

    <!-- Sección: Perfil Extendido -->
    <div>
      <p class="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-3">Perfil Extendido</p>
      <div class="grid grid-cols-2 gap-4">
        <div data-showcase-root>
          <app-select label="Género" formControlName="gender" [options]="genderOptions()" placeholder="Seleccionar..."></app-select>
        </div>
        <div data-showcase-root>
          <app-select label="Nacionalidad" formControlName="nationality" [options]="nationalityOptions()" [searchable]="true" placeholder="Buscar país..."></app-select>
        </div>
        <div>
          <app-datetime-picker label="Fecha de nacimiento" formControlName="birthDate" type="date"></app-datetime-picker>
        </div>
        <div>
          <app-input label="Teléfono" formControlName="phone" placeholder="+58 412 000 0000"></app-input>
        </div>
        <div class="col-span-2">
          <app-input label="Dirección" formControlName="address" placeholder="Ej: Av. Principal..."></app-input>
        </div>
      </div>
    </div>

    <!-- Sección: Roles -->
    <div>
      <p class="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-3">Roles y Permisos</p>
      <div class="grid grid-cols-1 gap-4">
        <div data-showcase-root>
          <app-select label="Rol" formControlName="roleName" [options]="roleOptions()" [required]="true"></app-select>
        </div>
      </div>
    </div>

  </form>

  <!-- Footer con botones -->
  <div *ngIf="!isLoading()" class="flex gap-3 border-t border-slate-200 dark:border-slate-700
              px-6 py-4 bg-slate-50/50 dark:bg-slate-800/50 flex-shrink-0">
    <app-button type="button" variant="secondary" [fullWidth]="true" (click)="onCancel.emit()">
      Cancelar
    </app-button>
    <app-button variant="primary" [fullWidth]="true" [loading]="isSaving()" (click)="submit()">
      <i *ngIf="!isSaving()" leftIcon class="fa-solid fa-floppy-disk text-sm"></i>
      Guardar Cambios
    </app-button>
  </div>

</div>
